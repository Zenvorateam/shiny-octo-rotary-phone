<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0f">
<title>Admin · Realistic Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--ink:#111215;--mut:#6b6f78;--paper:#f1f2f4;--line:#dfe1e6;--gd:linear-gradient(135deg,#0e0f11,#24272c 55%,#4b5058);--gg:linear-gradient(135deg,#f6e7b8,#e0b95f);--gwg:linear-gradient(135deg,#fff,#e6e8ed);--gyl:linear-gradient(135deg,#fffbe6,#f4dd92);--gpk:linear-gradient(135deg,#fff0f5,#fbc9dc);--gor:linear-gradient(135deg,#fff3e4,#ffc9a0);--ok:#1e7a45}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(800px 380px at 90% -80px,#e3e5e9,transparent) no-repeat,var(--paper);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.brand,.big{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.02em}
h1,h2,h3,h4,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
.btn{min-height:44px;padding:0 18px;border-radius:99px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s;white-space:nowrap}.btn:active{transform:scale(.97)}
.dk{background:var(--gd);color:#fff;box-shadow:0 8px 20px #0b0c1030}.gold{background:var(--gg);color:#15161a}.ol{background:#fff;border:1px solid var(--line)}.rd{background:#fff;border:1px solid #ecc7c7;color:#a33}.sm{min-height:36px;padding:0 14px;font-size:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;white-space:nowrap}.brand b{width:34px;height:34px;border-radius:11px;background:#fff;color:#15161a;display:grid;place-items:center}
/* gate */
#gate{min-height:100dvh;display:grid;place-items:center;padding:20px;background:var(--gd)}
.gc{width:min(400px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 30px 60px #0008}.gc h1{font-size:26px;margin:16px 0 4px}.gc p{color:var(--mut);margin-bottom:16px}
.gc .brand b{background:var(--gd);color:#f0d27a}
/* shell */
.hd{position:sticky;top:0;z-index:30;background:var(--gd);color:#fff}
.hr{width:min(1240px,100% - 24px);margin:auto;min-height:60px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.hr .sp{flex:1}.chip{font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px;background:#ffffff1f;border:1px solid #ffffff33}.chip.on{background:var(--gg);color:#15161a;border:0}.chip.off{background:#f4dede;color:#a33;border:0}
.lay{width:min(1240px,100% - 24px);margin:14px auto 60px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.nv{position:sticky;top:76px;display:grid;gap:4px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px}
.nv button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:14px;font-weight:600;color:#3a3d44}.nv button i{font-style:normal;width:24px;text-align:center}.nv button.on{background:var(--gg);color:#15161a}.nv button:hover:not(.on){background:var(--paper)}
#main{min-width:0;display:grid;gap:14px}
.card{background:linear-gradient(160deg,#fff,#eef0f4);border:1px solid var(--line);border-radius:24px;padding:20px}
.card h2{font-size:22px;font-weight:800}.card .sub{color:var(--mut);margin:2px 0 16px}.card h3{font-size:16px;margin:18px 0 10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.g1{display:grid;gap:12px}
.f{display:block}.f>span{display:block;font-weight:600;font-size:12px;margin-bottom:5px;color:#3a3d44}.f small{display:block;color:var(--mut);margin-top:4px;font-size:11px}
.f input,.f select,.f textarea,.q{width:100%;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;background:#fff;outline:none}.f textarea{height:auto;padding:12px 14px;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus,.q:focus{border-color:#8a909c;box-shadow:0 0 0 4px #9aa0aa33}.f input[type=color]{padding:3px;width:100%}.f input[type=checkbox]{height:auto}
.tg{display:flex;align-items:center;gap:12px;cursor:pointer;padding:6px 0;font-weight:600}.tg input{position:absolute;opacity:0}.tg i{width:46px;height:26px;border-radius:99px;background:#c9ccd4;position:relative;transition:.2s;flex:none}.tg i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px #0003}.tg input:checked+i{background:#15161a}.tg input:checked+i:after{left:23px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat div{border-radius:20px;padding:16px;border:1px solid var(--line)}.stat b{display:block;font:800 26px "Bricolage Grotesque",sans-serif}.stat small{color:#4b4f58}
.stat div:nth-child(1){background:var(--gwg)}.stat div:nth-child(2){background:var(--gyl)}.stat div:nth-child(3){background:var(--gpk)}.stat div:nth-child(4){background:var(--gor)}
.hero{border-radius:24px;padding:22px;background:var(--gd);color:#fff;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hero h2{color:#fff}.hero p{color:#c9cbd4}
.ck{display:grid;gap:8px}.ck div{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.ck i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:#e3e5ea;flex:none}.ck .y i{background:var(--gg)}.ck span{flex:1}.ck a,.ck button{color:var(--ink);font-weight:700;font-size:12px;text-decoration:underline}
details.it{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}details.it>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;font-weight:700}details.it>summary::-webkit-details-marker{display:none}
details.it>summary:after{content:"›";margin-left:auto;font-size:22px;color:var(--mut);transition:.2s}details.it[open]>summary:after{transform:rotate(90deg)}details.it>summary img{width:42px;height:48px;border-radius:10px;object-fit:cover;background:var(--paper)}details.it>summary small{display:block;color:var(--mut);font-weight:500}
.itb{padding:4px 14px 16px;display:grid;gap:12px;border-top:1px solid var(--line)}.acts{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--gyl);border:1px solid #ecd58a}.badge.x{background:#f4dede;border-color:#e8b9b9;color:#a33}
.sw{height:34px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px}.gw{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.gw b{display:block;font-size:12px;margin-bottom:6px}.gw .r{display:flex;gap:8px;align-items:center;margin-top:8px}.gw input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#fff}.gw input.v{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:11px}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cl label{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;font-weight:600;display:grid;gap:6px}.cl input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);border-radius:10px}
.rw{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}.rw input{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;min-width:0}
.tx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:6px}.tx span{font-size:12px;color:#4b4f58;word-break:break-word}.tx input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:0;width:100%}.tx.ch{background:var(--gyl);border-color:#ecd58a}
.note{background:var(--gyl);border:1px solid #ecd58a;border-radius:16px;padding:12px 14px;font-size:12px;color:#5a4510}.note.r{background:var(--gpk);border-color:#f3b9cf;color:#7a2147}
.pvm{position:fixed;inset:0;z-index:60;background:#0b0c10e6;display:none;flex-direction:column}.pvm.on{display:flex}.pvh{display:flex;gap:8px;align-items:center;padding:10px 14px;color:#fff;flex-wrap:wrap}.pvh .sp{flex:1}.pvb{flex:1;display:grid;place-items:stretch center;padding:0 10px 10px;min-height:0}.pvb iframe{width:100%;max-width:100%;height:100%;border:0;border-radius:18px;background:#fff;transition:width .25s}
.toast{position:fixed;z-index:80;left:50%;bottom:30px;transform:translate(-50%,16px);background:var(--gd);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.err{color:#b04030;font-size:12px;min-height:16px}
@media(max-width:860px){.lay{grid-template-columns:minmax(0,1fr)}.nv{position:sticky;top:60px;z-index:20;display:flex;overflow-x:auto;scrollbar-width:none;border-radius:18px}.nv::-webkit-scrollbar{display:none}.nv button{flex:none;white-space:nowrap;padding:9px 12px}.card{padding:16px;border-radius:20px}.rw{grid-template-columns:1fr 1fr auto}.tx{grid-template-columns:minmax(0,1fr)}}

/* ===== dashboard look ===== */
body{background:#f4f5f7}
.hd{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.hd .brand b{background:var(--gd);color:#f0d27a}
.hd .chip{background:#f1f2f4;border-color:var(--line);color:#3a3d44}.hd .chip.on{background:#e6f4ea;color:#1e7a45;border:0}.hd .chip.off{background:#fde8e8;color:#a33}
.hd .btn[data-act=lock]{background:#f1f2f4!important;color:var(--ink)!important}
.lay{grid-template-columns:240px minmax(0,1fr);gap:20px}
.nv{background:var(--gd);border:0;border-radius:22px;padding:12px;gap:2px;box-shadow:0 14px 34px #0b0c1022}
.nv button{color:#c9cbd4;border-radius:12px}.nv button:hover:not(.on){background:#ffffff14;color:#fff}.nv button.on{background:var(--gg);color:#15161a}
.card{background:#fff;border:1px solid #e8eaee;border-radius:20px;box-shadow:0 1px 2px #0000000a,0 10px 28px #0000000a}
.hero{background:var(--gd);border-radius:22px;padding:26px;box-shadow:0 14px 34px #0b0c1030}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid #e8eaee;border-radius:20px;padding:18px;box-shadow:0 1px 2px #0000000a}
.kpi i{font-style:normal;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:12px;background:var(--gyl)}
.kpi:nth-child(2) i{background:var(--gpk)}.kpi:nth-child(3) i{background:var(--gor)}.kpi:nth-child(4) i{background:var(--gwg);border:1px solid var(--line)}
.kpi b{display:block;font:800 30px "Bricolage Grotesque",sans-serif;line-height:1}.kpi small{color:var(--mut);font-weight:600}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qt{display:grid;gap:3px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;transition:.15s}.qt:hover{transform:translateY(-2px);background:#fff;box-shadow:0 8px 20px #0000000f}
.qt i{font-style:normal;font-size:20px}.qt small{color:var(--mut);font-size:11px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rp{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.rp:last-child{border:0}.rp img{width:44px;height:50px;border-radius:10px;object-fit:cover;background:var(--paper)}.rp span{flex:1;min-width:0}.rp b,.rp small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rp small{color:var(--mut)}
@media(max-width:860px){.lay{grid-template-columns:minmax(0,1fr)}.nv{border-radius:16px;padding:6px}.hr{gap:6px}}

/* ===== phone app look ===== */
@media(max-width:860px){
body{padding-bottom:84px}
.hd{padding-top:env(safe-area-inset-top)}.hr{min-height:54px;gap:6px}.hr .brand span{display:none}
.hr .btn.sm{min-height:36px;padding:0 12px}
.lay{margin-top:8px;width:calc(100% - 20px)}
.nv{position:fixed!important;left:0;right:0;bottom:0;top:auto!important;z-index:45;border-radius:0!important;padding:6px 6px calc(6px + env(safe-area-inset-bottom))!important;background:#fff!important;border:0!important;border-top:1px solid var(--line)!important;box-shadow:0 -8px 24px #0b0c1014!important;gap:2px}
.nv button{flex-direction:column;gap:1px;min-width:66px;padding:7px 4px!important;font-size:10px;color:#8b8f99!important;border-radius:12px}
.nv button i{font-size:18px;width:auto}.nv button.on{background:transparent!important;color:#111!important;font-weight:800}.nv button.on i{background:var(--gg);border-radius:10px;padding:2px 12px;width:auto}
.card{border-radius:18px;padding:14px}.card h2{font-size:19px}
.hero{padding:18px;border-radius:20px}.kpis{grid-template-columns:repeat(2,1fr)}
.toast{bottom:92px}
.hr{flex-wrap:nowrap!important}.hr .btn.sm{padding:0 10px;font-size:12px;min-height:34px}.hr #dy{font-size:10px;padding:4px 8px;white-space:nowrap}.hr #st{display:none}.hr [data-act=lock]{font-size:0;padding:0 12px}.hr [data-act=lock]::before{content:"🔒";font-size:14px}
}
</style></head>
<body>
<div id="gate"></div>
<div id="app" hidden>
<header class="hd"><div class="hr"><div class="brand"><b>R.</b><span>Admin</span></div><span class="chip" id="st"></span><span class="chip" id="dy"></span><div class="sp"></div><button class="btn gold sm" data-act="preview">👁 Preview</button><button class="btn gold sm" data-act="pub">⬆ Publish</button><button class="btn sm" style="background:#ffffff1f;color:#fff" data-act="lock">Lock</button></div></header>
<div class="lay"><nav class="nv" id="nv"></nav><main id="main"></main></div>
</div>
<div class="pvm" id="pvm"><div class="pvh"><b>Live preview</b><button class="btn gold sm" data-w="360">📱 Phone</button><button class="btn gold sm" data-w="768">Tablet</button><button class="btn gold sm" data-w="100%">Desktop</button><span class="sp"></span><button class="btn sm" style="background:#ffffff26;color:#fff" data-act="pvx">✕ Close</button></div><div class="pvb"><iframe id="pvf" title="Preview"></iframe></div></div>
<iframe id="hx" hidden title="data"></iframe>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem('rma_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('rma_'+k,JSON.stringify(v))}catch(e){toast('Browser storage is full. Remove big images.')}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2600)}
let BASE=null,LIVE=null,C=null,sec='dash',dirty=false,TEXTS=null,OPEN={},sv_t=0;
const g=(o,p)=>String(p).split('.').reduce((a,k)=>a==null?a:a[k],o);
function sv(p,v){const k=String(p).split('.');let o=C;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function merge(b,d){if(b===null||typeof b!=='object'||Array.isArray(b))return clone(d===undefined?b:d);const o={};new Set([...Object.keys(b),...Object.keys(d||{})]).forEach(k=>{const x=b[k],y=d?d[k]:undefined;o[k]=y===undefined?clone(x):(x&&typeof x==='object'&&!Array.isArray(x)&&y&&typeof y==='object'&&!Array.isArray(y))?merge(x,y):clone(y)});return o}
const fm=n=>'₹'+Number(n).toLocaleString('en-IN');
/* ---------- password gate ---------- */
async function hash(s){try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rm|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=2166136261;for(const c of 'rm|'+s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16)}
async function pwOk(v){const h=LS.get('pw',null);return h?(await hash(v))===h:v==='RRR'}
function gate(){$('#app').hidden=true;$('#gate').hidden=false;$('#gate').innerHTML=`<div class="gc"><div class="brand"><b>R.</b><span>Realistic Mart</span></div><h1>Admin access</h1><p>Enter the admin password to manage your store.</p><label class="f"><span>Password</span><input id="gp" type="password" autocomplete="current-password" autofocus></label><p class="err" id="ge"></p><button class="btn dk" style="width:100%;margin-top:6px" data-act="unlock">Unlock</button></div>`;$('#gp').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()})}
async function unlock(){if(!(await pwOk($('#gp').value)))return $('#ge').textContent='Wrong password.';sessionStorage.setItem('rma_ok','1');start()}
/* ---------- boot ---------- */
function start(){$('#gate').hidden=true;$('#app').hidden=false;$('#main').innerHTML='<div class="card"><h2>Loading your store…</h2><p class="sub">Reading the current website settings.</p></div>';nav();
 const hx=$('#hx');hx.src='index.html?preview=1';window.bt=setTimeout(()=>{if(!BASE)$('#main').innerHTML='<div class="card"><h2>Could not read index.html</h2><p class="sub">Keep admin.html in the same folder as index.html on your site, then reload this page.</p></div>'},8000)}
async function boot2(){clearTimeout(window.bt);const k=sbc();if(k.url){try{const r=await fetch(k.url+'/rest/v1/site_settings?id=eq.main&select=data',{headers:{apikey:k.key,Authorization:'Bearer '+k.key}}),x=await r.json();if(x&&x[0]&&x[0].data&&x[0].data.v)LIVE=x[0].data}catch(e){}}
 if(!LIVE)try{const r=await fetch('site.json?'+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.v)LIVE=j}}catch(e){}
 const d=LS.get('draft',null);C=merge(BASE,d||LIVE||{});dirty=!!d;render()}
addEventListener('message',e=>{const d=e.data||{};
 if(d.type==='rm-ready'){if(e.source===$('#hx').contentWindow){if(!BASE){BASE=d.base;boot2()}}else if(e.source===$('#pvf').contentWindow)pushPv()}
 else if(d.type==='rm-texts'){TEXTS=d.list;if(sec==='texts')render()}});
function pushPv(){const w=$('#pvf').contentWindow;if(w&&C)w.postMessage({type:'rm-apply',cfg:C},'*')}
function touch(){dirty=true;clearTimeout(sv_t);sv_t=setTimeout(()=>{LS.set('draft',C);pushPv()},350);hdr()}
function hdr(){if(!C)return;const s=$('#st');s.textContent=C.open===false?'Store closed':'Store open';s.className='chip '+(C.open===false?'off':'on');$('#dy').textContent=dirty?'Unpublished changes':'Up to date'}
/* ---------- helpers ---------- */
const fld=(l,p,o={})=>{const v=g(C,p),t=o.t||'text',a=`data-p="${p}"${o.re?' data-re="1"':''}`;
 if(t==='area')return `<label class="f"><span>${l}</span><textarea ${a} rows="${o.r||3}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>${o.h?`<small>${o.h}</small>`:''}</label>`;
 if(t==='tog')return `<label class="tg"><input type="checkbox" ${a} ${v&&v!=='0'?'checked':''}><i></i><span>${l}</span></label>`;
 return `<label class="f"><span>${l}</span><input ${a} data-t="${t==='number'?'n':'s'}" type="${t}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.step?`step="${o.step}"`:''}>${o.h?`<small>${o.h}</small>`:''}</label>`};
const sel=(l,p,opts,o={})=>{const v=g(C,p);return `<label class="f"><span>${l}</span><select data-p="${p}" ${o.n?'data-t="n"':''}>${opts.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(v)?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label>`};
const grad=(l,p)=>{const v=g(C.theme.vars,p)||'';return `<div class="gw"><b>${l}</b><div class="sw" style="background:${esc(v)}"></div><input class="v" data-p="theme.vars.${p}" value="${esc(v)}" aria-label="${l} CSS"><div class="r"><input type="color" class="c1" value="#f6e7b8"><input type="color" class="c2" value="#e0b95f"><button class="btn ol sm" data-gset="${p}">Use colours</button></div></div>`};
const col=(l,p)=>`<label class="cl-i">${l}</label>`;

const ACT={unlock,

 syncTexts(){const o=BASE.rules,n=C.rules,add=(a,b)=>{if(a!==b&&!C.text.some(x=>x.f===a))C.text.push({f:a,r:b,auto:1})};C.text=C.text.filter(x=>!x.auto);
  [0,1].forEach(i=>{[o.n[i]!==n.n[i]&&['n',i],o.p[i]!==n.p[i]&&['p',i]].filter(Boolean).forEach(([k,j])=>{['above ','from ','starts at '].forEach(w=>add(w+fm(o[k][j]),w+fm(n[k][j])))});if(o.pct[i]!==n.pct[i]){['above','from'].forEach(w=>add(o.pct[i]+'% off '+w,n.pct[i]+'% off '+w));['Prime','Member'].forEach(w=>add(w+' '+o.pct[i]+'% off',w+' '+n.pct[i]+'% off'))}});
  if(o.free!==n.free){add('above '+fm(o.free),'above '+fm(n.free));add('over '+fm(o.free),'over '+fm(n.free))}if(o.fee!==n.fee)add('otherwise '+fm(o.fee),'otherwise '+fm(n.fee));touch();toast(C.text.filter(x=>x.auto).length+' text updates added');render()},
 async testDb(){const d=C.db,r=$('#dbres');if(!d.url)return r.textContent='Enter the database URL first.';r.textContent='Testing…';try{const H={};if(d.key){H.apikey=d.key;H.Authorization='Bearer '+d.key}const x=await fetch(d.url,{headers:H});r.textContent=x.ok?'Connected ('+x.status+')':'Server reached, but replied '+x.status}catch(e){r.textContent='Could not connect. Check the URL, or the server blocks browser requests.'}},
 async pw(){const v=$('#np').value;if(v.length<4)return toast('Use at least 4 characters');LS.set('pw',await hash(v));$('#np').value='';toast('Password changed')},
 dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(prepared(),null,1)],{type:'application/json'}));a.download='site.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
 async copy(){try{await navigator.clipboard.writeText(JSON.stringify(prepared(),null,1));toast('Copied')}catch(e){toast('Copy not allowed here. Use Download.')}},
 pub};
function prepared(){const o=clone(C);o.v=1;o.updated=Date.now();o.db.extra=o.db.extra.filter(x=>!x.priv&&x.k);o.text=o.text.filter(x=>x.f);o.admins=o.admins.filter(Boolean);return o}
function problems(){const p=[];if(!C.pay.cod&&!(C.pay.rzp&&C.pay.key))p.push('Turn on at least one payment method (cash on delivery, or Razorpay with a key).');if(!C.products.some(x=>x.active))p.push('Show at least one product.');const r=C.rules;if(+r.n[0]>=+r.n[1]||+r.p[0]>=+r.p[1])p.push('Discount tiers: the second amount must be higher than the first.');if([r.free,r.fee,r.pf,r.cut,...r.pct,...r.n,...r.p,...r.eta.m,...r.eta.s,...r.eta.r].some(x=>x===''||isNaN(+x)))p.push('Delivery & discounts has an empty number.');return p}
async function pub(){const res=$('#pubres'),say=m=>{if(res)res.textContent=m;toast(m)};const pr=problems();if(pr.length){sec=sec==='pub'?sec:'pub';say(pr[0]);return}
 const gh=LS.get('gh',{});if(!gh.token||!gh.repo){sec='pub';render();$('#pubres').textContent='Add your GitHub repository and token first.';return}
 say('Publishing…');const path=gh.path||'site.json',br=gh.branch||'main',u=`https://api.github.com/repos/${gh.repo}/contents/${path}`,H={Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'};
 try{let sha;const r0=await fetch(`${u}?ref=${encodeURIComponent(br)}`,{headers:H});if(r0.ok)sha=(await r0.json()).sha;else if(r0.status!==404)throw new Error(r0.status===401||r0.status===403?'GitHub refused the token. Check its permissions.':'GitHub error '+r0.status);
  const body=JSON.stringify(prepared(),null,1),r=await fetch(u,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Update site from admin',content:btoa(unescape(encodeURIComponent(body))),sha,branch:br})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'GitHub error '+r.status)}
  LIVE=prepared();localStorage.removeItem('rma_draft');dirty=false;LS.set('lastpub',Date.now());hdr();say('Published. Your host may take a minute to show it.');if(sec==='dash')render()}catch(e){say(e.message||'Could not publish.')}}
const sbc=()=>{const c=window.RM_CONFIG||{},d=(C&&C.db&&C.db.type==='supabase')?C.db:{};return{url:String(c.supabaseUrl||d.url||'').replace(/\/$/,''),key:c.supabaseAnonKey||d.key||''}};
S.cloud=function(){const k=sbc(),tok=sessionStorage.getItem('rma_sbtok');return `<div class="card">${head('Orders & cloud (Supabase)','Keys come from config.js. Log in once to publish changes and see orders.')}${k.url?`<div class="note">Connected to <b>${esc(k.url)}</b></div>`:'<div class="note r">Fill supabaseUrl and supabaseAnonKey in config.js first.</div>'}${k.url&&!tok?`<div class="g2" style="margin-top:12px"><label class="f"><span>Admin email</span><input id="sbe" type="email" autocomplete="username"></label><label class="f"><span>Password</span><input id="sbp" type="password" autocomplete="current-password"></label></div><div class="acts" style="margin-top:12px"><button class="btn dk" data-act="sbLogin">Log in</button></div>`:''}${tok?`<div class="acts" style="margin:12px 0"><button class="btn gold" data-act="pub">⬆ Publish to Supabase</button><button class="btn ol" data-act="sbOrders">↻ Load orders</button><button class="btn ol" data-act="sbOut">Log out</button></div><div id="sbo"></div>`:''}</div>`};
const sbH=()=>({apikey:sbc().key,Authorization:'Bearer '+(sessionStorage.getItem('rma_sbtok')||sbc().key)});
Object.assign(ACT,{
async sbLogin(){const k=sbc();try{const r=await fetch(k.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:k.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('#sbe').value.trim(),password:$('#sbp').value})}),j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.error_description||j.msg||'Login failed');sessionStorage.setItem('rma_sbtok',j.access_token);toast('Logged in');render()}catch(x){toast(x.message)}},
sbOut(){sessionStorage.removeItem('rma_sbtok');render()},
async sbOrders(){const b=$('#sbo');b.textContent='Loading…';try{const r=await fetch(sbc().url+'/rest/v1/orders?select=id,data,created_at&order=created_at.desc&limit=50',{headers:sbH()});if(!r.ok)throw new Error(r.status===401?'Session expired. Log in again.':'Error '+r.status);const L=await r.json();b.innerHTML=L.length?L.map(x=>{const o=x.data||{};return `<div class="rp"><span><b>${esc(x.id)} · ${fm(o.total||0)}</b><small>${esc(o.nm||'')} · ${esc(o.ph||'')} · ${esc(o.pin||'')} · ${o.pm==='razorpay'?'Paid online':'COD'}</small><small>${esc(o.ad||'')}</small></span></div>`}).join(''):'<p class="sub">No orders yet.</p>'}catch(e){b.textContent=e.message}}});
async function cloudPub(){const pr=problems();if(pr.length)return toast(pr[0]);const k=sbc();toast('Publishing…');try{const r=await fetch(k.url+'/rest/v1/site_settings',{method:'POST',headers:{...sbH(),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:'main',data:prepared(),updated_at:new Date().toISOString()})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'Supabase error '+r.status)}LIVE=prepared();localStorage.removeItem('rma_draft');dirty=false;LS.set('lastpub',Date.now());hdr();toast('Published. Live in seconds.');if(sec==='dash')render()}catch(e){toast(e.message)}}
{const _gh=ACT.pub;ACT.pub=()=>sbc().url?(sessionStorage.getItem('rma_sbtok')?cloudPub():(sec='cloud',render(),toast('Log in to Supabase first'))):_gh()}
